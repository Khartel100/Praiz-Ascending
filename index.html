<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160c5b">
  <title>Praiz Ascending 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ HOME PAGE ============ -->
  <main id="home" class="page is-active">
    <img class="flyer" src="images/flyer.jpg" alt="Praiz Ascending 2026, 4th October 2026, 4:00PM, Global Evangelical Church, Fire Chapel, Atadeka Downtown">

    <section class="home-panel">
      <p>Join us for a powerful time of worship, praise and life changing presence of God. Come expecting more!</p>
      <button class="cta" data-go="contact" type="button">
        <img src="images/icon-pin.png" alt="" aria-hidden="true">
        <span>GET DIRECTIONS</span>
      </button>
    </section>
  </main>

  <!-- ============ MAP PAGE ============ -->
  <main id="map" class="page">
    <header class="top rounded">
      <img class="logo" src="images/logo.png" alt="Praiz Ascending">
      <h1>Fill in your details to get direction on the program day</h1>
    </header>

    <div class="embed-area">
      <!-- EMBED HERE: replace this whole <div class="placeholder"> with your Google Maps / Google Forms <iframe> -->
      <div class="placeholder">Embed goes here</div>
    </div>
  </main>

  <!-- ============ CONTACT PAGE ============ -->
  <main id="contact" class="page">
    <header class="top">
      <img class="logo" src="images/logo.png" alt="Praiz Ascending">
    </header>

    <div class="embed-area">
      <!-- EMBED HERE: replace this whole <div class="placeholder"> with your Google Maps / Google Forms <iframe> -->
      <div class="placeholder">Embed goes here</div>
    </div>
  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="nav" aria-label="Main">
    <button data-go="home" type="button" aria-label="Home" class="is-active"><img src="images/icon-home.png" alt=""></button>
    <button data-go="contact" type="button" aria-label="Directions"><img src="images/icon-map.png" alt=""></button>
    <button data-go="map" type="button" aria-label="Contact"><img src="images/icon-phone.png" alt=""></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
