<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160c5b">
  <title>Praiz Ascending 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <main id="home" class="page is-active">
    <img class="flyer" src="images/flyer.jpg" alt="Praiz Ascending 2026, 4th October 2026, 4:00PM, Global Evangelical Church, Fire Chapel, Atadeka Downtown">

    <section class="home-panel">
      <div class="countdown">
        <div class="cd-label" id="cd-label">Event starts in</div>
        <div class="cd-units" id="cd-units">
          <div><b id="cd-d">0</b><small>Days</small></div>
          <div><b id="cd-h">00</b><small>Hours</small></div>
          <div><b id="cd-m">00</b><small>Mins</small></div>
          <div><b id="cd-s">00</b><small>Secs</small></div>
        </div>
      </div>
      <p>Join us for a powerful time of worship, praise and life changing presence of God. Come expecting more!</p>
      <button class="cta" data-go="map" type="button">
        <img src="images/icon-pin.png" alt="" aria-hidden="true">
        <span>GET DIRECTIONS</span>
      </button>
    </section>
  </main>

  
  <main id="contact" class="page">
    <header class="top rounded">
      <img class="logo" src="images/logo.png" alt="Praiz Ascending">
      <h1>Fill in your details to get direction to the venue</h1>
    </header>

    <div class="embed-area">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeNVN5usfHYZjoeLL7zp016ckbHhDXirNZzekDAk2ox1hDObg/viewform?embedded=true" width="640" height="700" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>
  </main>

  
  <main id="map" class="page">
    <header class="top">
      <img class="logo" src="images/logo.png" alt="Praiz Ascending">
    </header>

    <div class="embed-area">
     
     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d127066.88561546968!2d-0.24849378662729715!3d5.590623526578311!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdf7fba884efba3%3A0x15d34eb7b4934a60!2sGLOBAL%20EVANGELICAL%20CHURCH%2C%20FIRE%20CHAPEL!5e0!3m2!1sen!2sgh!4v1790680818276!5m2!1sen!2sgh" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </main>

  
  <nav class="nav" aria-label="Main">
    <button data-go="home" type="button" aria-label="Home" class="is-active"><img src="images/icon-home.png" alt=""></button>
    <button data-go="map" type="button" aria-label="Directions"><img src="images/icon-map.png" alt=""></button>
    <button data-go="contact" type="button" aria-label="Contact"><img src="images/icon-phone.png" alt=""></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
